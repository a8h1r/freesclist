<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dailies — FreeSCList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:            #0A0A0B;
  --bg-panel:      #111214;
  --bg-panel-2:    #0D0D0E;
  --ink:           #F7F5F1;
  --ink-soft:      #C7C4BC;
  --ink-faint:     #85827B;
  --gold:          #CDA23D;
  --gold-soft:     #E4C878;
  --border:        rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.20);
  --font-display: 'Baloo 2', 'Fredoka', sans-serif;
  --font-body:    'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --container: 1180px;
}
*, *::before, *::after{ box-sizing: border-box; }
body{ margin: 0; background: var(--bg); color: var(--ink-soft); font-family: var(--font-body); line-height: 1.7; }
a{ color: inherit; text-decoration: none; }
button{ cursor: pointer; font-family: inherit; }
.container{ width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: 32px; }

/* Header */
.site-header{ background: var(--bg); border-bottom: 1px solid var(--border); }
.nav{ display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.brand{ display: flex; align-items: center; gap: 10px; background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 6px 16px 6px 8px; }
.brand-word{ font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--ink); }
.brand-word .sc{ color: var(--gold); }
.nav-links{ display: flex; align-items: center; gap: 8px; }
.nav-links a{ padding: 10px 18px; font-size: 0.92rem; font-weight: 700; text-transform: uppercase; color: var(--ink-soft); transition: color 0.15s ease; border-bottom: 2px solid transparent; }
.nav-links a:hover, .nav-links a.is-active{ color: var(--ink); border-color: var(--ink); }

/* Main Header Bar */
.page-top-bar{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
.page-top-bar h1{ font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 3.2rem); color: var(--ink); margin: 0; }

/* Multiselect Dropdown */
.multiselect-container { position: relative; min-width: 220px; }
.multiselect-trigger { padding: 10px 18px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: var(--ink); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; user-select: none; transition: border-color 0.15s ease; font-size: 0.9rem; }
.multiselect-trigger:hover { border-color: var(--gold); }
.multiselect-trigger .arrow { font-size: 0.75rem; color: var(--gold); transition: transform 0.2s ease; }
.multiselect-trigger.is-open .arrow { transform: rotate(180deg); }

.multiselect-dropdown { position: absolute; top: 100%; right: 0; margin-top: 8px; width: 300px; background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 8px; max-height: 320px; overflow-y: auto; display: none; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 200; }
.multiselect-dropdown.is-open { display: block; }
.dropdown-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
.dropdown-header span { font-size: 0.8rem; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.close-btn { background: var(--gold); color: #000; border: none; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
.close-btn:hover { background: var(--gold-soft); }
.multiselect-dropdown label { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s ease; color: var(--ink); font-size: 0.95rem; }
.multiselect-dropdown label:hover { background: rgba(255,255,255,0.05); }
.multiselect-dropdown input { width: 18px; height: 18px; accent-color: var(--gold); }

/* Dailies Format */
.date-heading{ font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; color: var(--ink); margin: 32px 0 20px; }
.date-heading:first-child{ margin-top: 0; }
.entry-list{ display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin-bottom: 40px; }
.entry-line{ font-size: 1.05rem; color: var(--ink-soft); }
.entry-line .casino{ font-weight: 700; color: var(--ink); }
.entry-line a{ color: var(--gold); font-weight: 600; border-bottom: 1px solid rgba(205,162,61,0.4); transition: color 0.15s ease, border-color 0.15s ease; }
.entry-line a:hover{ color: var(--gold-soft); border-color: var(--gold-soft); }

/* Ad slots */
.ad-slot{ max-width: 760px; margin: 0 0 32px; }
.ad-slot .ad-slot-inner{ border: 1px dashed var(--border-strong); border-radius: 8px; padding: 10px; text-align: center; color: var(--ink-faint); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }

/* Footer */
.site-footer{ background: #000; border-top: 1px solid var(--border); margin-top: 80px; }
.footer-inner{ padding-block: 50px 34px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.footer-links{ display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.footer-links a{ color: var(--ink-soft); font-size: 0.88rem; font-weight: 700; text-transform: uppercase; }
.footer-fine{ font-size: 0.82rem; color: var(--ink-faint); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a href="index.html" class="brand">
      <span class="brand-word">Free<span class="sc">SC</span>List</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="casinos.html">Dailys</a>
      <a href="my-list.html" class="is-active">My Casinos</a>
      <a href="top-sites.html">Top Sites</a>
      <a href="about-us.html">About Us</a>
      <a href="full-guide.html">Full Guide</a>
    </nav>
  </div>
</header>

<main class="container" style="max-width: 800px; margin-top: 50px;">
  <div class="page-top-bar">
    <h1>My Dailies</h1>

    <div class="multiselect-container">
      <div class="multiselect-trigger" id="ddTrigger" onclick="toggleDropdown()">
        <span id="selectedCountText">Filter Casinos (0)</span>
        <span class="arrow">▼</span>
      </div>
      <div class="multiselect-dropdown" id="casino-checklist">
        <div class="dropdown-header">
          <span>Filter Your Casinos</span>
          <button type="button" class="close-btn" onclick="savePreferencesAndClose()">Done ✖</button>
        </div>
        <div id="casino-checkboxes-list">
          <p style="padding:10px;margin:0;">Loading casinos...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="ad-slot" aria-hidden="true">
    <div class="ad-slot-inner">Ad slot — see README.md</div>
  </div>

  <div id="feed-mount">
    <!-- Grouped Dailies populate here -->
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <nav class="footer-links">
      <a href="index.html">Home</a>
      <a href="casinos.html">Dailys</a>
      <a href="my-list.html">My Casinos</a>
      <a href="top-sites.html">Top Sites</a>
      <a href="about-us.html">About Us</a>
      <a href="full-guide.html">Full Guide</a>
    </nav>
    <p class="footer-fine">© 2026 FreeSCList. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/lib/supabase.js"></script>
<script>
function getUserId() {
    let uid = localStorage.getItem('freesclist_user_id');
    if (!uid) {
        uid = 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('freesclist_user_id', uid);
    }
    return uid;
}

const userId = getUserId();

async function init() {
    const sb = getSupabase();
    if (!sb) return;

    // Fetch all active casinos
    const { data: allCasinos } = await sb.from('casinos').select('*').eq('is_active', true).order('name');

    // Fetch user watchlist
    const { data: watchlist } = await sb.from('user_watchlist').select('casino_id').eq('user_id', userId);
    const watchedIds = new Set((watchlist || []).map(w => w.casino_id));

    // Render Dropdown Checkboxes
    const checklistDiv = document.getElementById('casino-checkboxes-list');
    checklistDiv.innerHTML = '';
    
    (allCasinos || []).forEach(c => {
        const label = document.createElement('label');
        label.innerHTML = `
            <input type="checkbox" value="${c.id}" ${watchedIds.has(c.id) ? 'checked' : ''} onchange="updateSelectedCount()">
            ${c.name}
        `;
        checklistDiv.appendChild(label);
    });

    updateSelectedCount();
    loadFeed();
}

async function savePreferencesAndClose() {
    toggleDropdown();
    const sb = getSupabase();
    if (!sb) return;
    
    const checkboxes = document.querySelectorAll('#casino-checkboxes-list input[type="checkbox"]:checked');
    const casinoIds = Array.from(checkboxes).map(cb => cb.value);

    // Update watchlist in Supabase
    await sb.from('user_watchlist').delete().eq('user_id', userId);
    if (casinoIds.length > 0) {
        await sb.from('user_watchlist').insert(casinoIds.map(cid => ({ user_id: userId, casino_id: cid })));
    }

    loadFeed();
}

async function loadFeed() {
    const sb = getSupabase();
    const mount = document.getElementById('feed-mount');
    if (!sb || !mount) return;

    // Get user's watched casino IDs
    const { data: watchlist } = await sb.from('user_watchlist').select('casino_id').eq('user_id', userId);
    const watchedCasinoIds = (watchlist || []).map(w => w.casino_id);

    let feed = [];
    if (watchedCasinoIds.length > 0) {
        const { data } = await sb.from('freebies').select('*, casinos(name)').in('casino_id', watchedCasinoIds).order('created_at', { ascending: false });
        feed = (data || []).map(item => ({
            ...item,
            casino_name: item.casinos ? item.casinos.name : ''
        }));
    }

    // 1. Generate valid 3 days
    const validDays = [];
    const now = new Date();
    for (let i = 0; i < 3; i++) {
        let d = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
        d.setDate(d.getDate() - i);
        let options = { month: 'long', day: 'numeric' };
        let parts = new Intl.DateTimeFormat('en-US', options).formatToParts(d);
        let month = '', day = '';
        for (let j = 0; j < parts.length; j++) {
            if (parts[j].type === 'month') month = parts[j].value;
            if (parts[j].type === 'day') day = parts[j].value;
        }
        let num = parseInt(day, 10);
        let suffix = 'th';
        if (num % 10 === 1 && num % 100 !== 11) suffix = 'st';
        else if (num % 10 === 2 && num % 100 !== 12) suffix = 'nd';
        else if (num % 10 === 3 && num % 100 !== 13) suffix = 'rd';
        validDays.push(month + ' ' + day + suffix);
    }

    // 2. Group by Date, filtering to only valid days
    const groups = {};
    feed.forEach(item => {
        const d = new Date(item.created_at);
        const dEst = new Date(d.toLocaleString('en-US', {timeZone: 'America/New_York'}));
        const parts = new Intl.DateTimeFormat('en-US', { month: 'long', day: 'numeric' }).formatToParts(dEst);
        let m = '', dayVal = '';
        for (let j = 0; j < parts.length; j++) {
            if (parts[j].type === 'month') m = parts[j].value;
            if (parts[j].type === 'day') dayVal = parts[j].value;
        }
        let num = parseInt(dayVal, 10);
        let suf = 'th';
        if (num % 10 === 1 && num % 100 !== 11) suf = 'st';
        else if (num % 10 === 2 && num % 100 !== 12) suf = 'nd';
        else if (num % 10 === 3 && num % 100 !== 13) suf = 'rd';
        const dateStr = m + ' ' + dayVal + suf;

        if (validDays.includes(dateStr)) {
            if (!groups[dateStr]) groups[dateStr] = [];
            groups[dateStr].push(item);
        }
    });

    // Render valid days (always include today if user has selected casinos)
    const todayStr = validDays[0];
    const sortedDates = validDays.filter(dayStr => (groups[dayStr] && groups[dayStr].length > 0) || (dayStr === todayStr && watchedCasinoIds.length > 0));

    mount.innerHTML = '';

    if (watchedCasinoIds.length === 0) {
        mount.innerHTML = '<p style="color:var(--ink-faint); padding-top: 20px;">No casinos selected yet. Click "Filter Casinos" above to choose your favorite casinos!</p>';
        return;
    }

    if (sortedDates.length === 0) {
        mount.innerHTML = '<p style="color:var(--ink-faint); padding-top: 20px;">No daily freebies available for your selected casinos yet. Check back soon!</p>';
        return;
    }

    sortedDates.forEach(date => {
        const dateHeading = document.createElement('h2');
        dateHeading.className = 'date-heading';
        dateHeading.textContent = date;
        mount.appendChild(dateHeading);

        const entryList = document.createElement('div');
        entryList.className = 'entry-list';

        const items = groups[date] || [];
        if (items.length === 0) {
            const emptyMsg = document.createElement('p');
            emptyMsg.className = 'entry-line';
            emptyMsg.style.color = 'var(--ink-faint)';
            emptyMsg.style.fontStyle = 'italic';
            emptyMsg.textContent = 'New freebies coming soon for your selected casinos...';
            entryList.appendChild(emptyMsg);
        } else {
            items.forEach(item => {
                const line = document.createElement('div');
                line.className = 'entry-line';
                line.innerHTML = `<span class="casino">${item.casino_name}: </span><a href="${item.claim_url}" target="_blank" rel="noopener noreferrer">${item.title || 'Free SC Offer'}</a>`;
                entryList.appendChild(line);
            });
        }

        mount.appendChild(entryList);
    });
}

function getOrdinalSuffix(d) {
    if (d > 3 && d < 21) return 'th';
    switch (d % 10) {
        case 1:  return "st";
        case 2:  return "nd";
        case 3:  return "rd";
        default: return "th";
    }
}

function toggleDropdown() {
    const dd = document.getElementById('casino-checklist');
    const trigger = document.getElementById('ddTrigger');
    dd.classList.toggle('is-open');
    trigger.classList.toggle('is-open');
}

// Close dropdown on outside click
document.addEventListener('click', (e) => {
    const container = document.querySelector('.multiselect-container');
    if (container && !container.contains(e.target)) {
        const dd = document.getElementById('casino-checklist');
        const trigger = document.getElementById('ddTrigger');
        if (dd && dd.classList.contains('is-open')) {
            savePreferencesAndClose();
        }
    }
});

function updateSelectedCount() {
    const checked = document.querySelectorAll('#casino-checkboxes-list input[type="checkbox"]:checked');
    const text = document.getElementById('selectedCountText');
    if (!text) return;
    text.textContent = 'Filter Casinos (' + checked.length + ')';
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
